# ⚠️ CONFIGURAÇÃO OFICIAL RENDER - CORRIGIDA ⚠️
services:
  - type: web
    name: ryan-xit-elite
    env: docker
    plan: free
    region: frankfurt
    
    # 🐳 AQUI É A MÁGICA: DEFINIMOS O DOCKERFILE DIRETO
    dockerfilePath: Dockerfile
    
    # 🔌 PORTAS LIBERADAS
    ports:
      - port: 8080
        protocol: tcp
      - port: 9000
        protocol: tcp

    # 🚫 DESATIVA CHECAGEM DE ERRO
    healthCheckPath: ""
    autoDeploy: true
