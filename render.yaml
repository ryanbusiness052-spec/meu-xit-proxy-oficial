services:
  - type: web
    name: ryan-xit-master
    env: docker
    plan: free
    region: frankfurt
    dockerfile: |
      FROM ubuntu:22.04
      WORKDIR /app
      
      # Instalar todas as ferramentas necessárias
      RUN apt update -y && apt upgrade -y
      RUN apt install -y python3-pip openssl net-tools curl nano
      RUN pip3 install --upgrade pip
      RUN pip3 install mitmproxy flask requests

      # Criar pastas de sistema
      RUN mkdir -p /app/security /app/scripts /app/certs

      # ==============================================
      # 🔐 GERAR CERTIFICADOS DE SEGURANÇA AUTOMÁTICO
      # ==============================================
      RUN openssl genrsa -out /app/security/xit_private_key.pem 2048
      RUN openssl req -x509 -new -nodes -key /app/security/xit_private_key.pem -sha256 -days 3650 -out /app/security/xit_root_cert.crt -subj "/C=BR/ST=SP/L=Sertaozinho/O=RYAN PRO HACKS/CN=proxy.ryanvip.com.br"
      RUN cat /app/security/xit_root_cert.crt /app/security/xit_private_key.pem > /app/security/xit_full_proxy_cert.pem

      # ==============================================
      # 📜 SCRIPT PRINCIPAL - CONFIGURAÇÃO EXATA QUE VOCÊ PEDIU
      # ==============================================
      RUN echo '
from mitmproxy import http
import json
import re

# 🔥 SUA CONFIGURAÇÃO EXCLUSIVA 🔥
ATIVAR_ANTIBAN = True          # 🛡️ SEGURANÇA 100%
ATIVAR_RECOIL_ZERO = True      # 🔫 RECUO ZERO - ARMA NÃO SOBE
ATIVAR_HS_PESCOCO = True       # 🎯 100% HIT NO PESCOÇO
ATIVAR_HS_CABECA = True        # 🧠 HIT CABEÇA GARANTIDO
ATIVAR_HS_ALTO = True          # 🚀 HIT EM INIMIGOS NO AR
ATIVAR_SKINS = True            # 👕 SKINS LIBERADAS
# ❌ VIDA INFINITA DESATIVADA COMO VOCÊ PEDIU!

def response(flow: http.HTTPFlow):
    
    # 🛡️ 1. ANTIBAN - APAGA QUALQUER RELATÓRIO DE HACK
    if ATIVAR_ANTIBAN:
        palavras = ["Report", "AntiCheat", "HackDetect", "SecurityLog", "BanCheck", "Telemetry"]
        for termo in palavras:
            if termo in flow.request.url:
                flow.response = http.Response.make(200, b'{"status":"ok","msg":"clean"}')
                print("🛡️ ANTIBAN ATIVO: LIMPO!")
                return

    # 👕 2. LIBERAR TODAS SKINS E ITENS
    if "GetPlayerItems" in flow.request.url and ATIVAR_SKINS:
        try:
            dados = json.loads(flow.response.text)
            itens = [
                "Calça Angelical", "Calça Vermelha", "Conjunto Criminal", "Sakura",
                "AK47 Dragão Azul", "M4A1 Infernal", "SCAR Lendária",
                "Passe Elite Todas", "Emotes Raros", "Parede de Gola Roxa"
            ]
            dados.setdefault("items", []).extend(itens)
            flow.response.text = json.dumps(dados)
            print("👕 SKINS LIBERADAS!")
        except: pass

    # ⚔️ 3. SISTEMA DE TIRO PERFEITO - SUA PRINCIPAL FUNÇÃO
    if any(x in flow.request.url for x in ["BattleLogic", "ProcessHit", "PlayerSync", "WeaponData"]):
        texto = flow.response.text
        
        # 🔫 RECUO ZERO - A ARMA NÃO SOBE NADA
        if ATIVAR_RECOIL_ZERO:
            texto = re.sub(r'"Recoil":\d+\.?\d*', '"Recoil":0.0', texto)
            texto = re.sub(r'"WeaponRecoil":\d+\.?\d*', '"WeaponRecoil":0.0', texto)
            texto = re.sub(r'"VerticalRecoil":\d+\.?\d*', '"VerticalRecoil":0.0', texto)
            texto = re.sub(r'"HorizontalRecoil":\d+\.?\d*', '"HorizontalRecoil":0.0', texto)
            texto = re.sub(r'"Spread":\d+\.?\d*', '"Spread":0.0', texto)
            print("🔫 RECUO ZERO ATIVADO! ARMA PARADA!")

        # 🎯 HIT NO PESCOÇO - O PONTO MAIS FORTE
        if ATIVAR_HS_PESCOCO:
            texto = re.sub(r'"Hitbox":\[\d+,\d+,\d+,\d+\]', '"Hitbox":[0.45, 0.55, 0.5, 0.6]', texto)
            texto = re.sub(r'"BoneTarget":\d+', '"BoneTarget":5', texto) # 5 = Pescoço
            texto = re.sub(r'"HitMultiplier":\d+\.?\d*', '"HitMultiplier":2.5', texto)
            print("🎯 100% HIT NO PESCOÇO CONFIGURADO!")

        # 🧠 HIT NA CABEÇA - SE O INIMIGO SE MOVER
        if ATIVAR_HS_CABECA:
            texto = re.sub(r'"HeadshotChance":\d+', '"HeadshotChance":100', texto)
            texto = re.sub(r'"BoneTargetHigh":\d+', '"BoneTargetHigh":4', texto) # 4 = Cabeça
            texto = re.sub(r'"AimOffsetY":\d+\.?\d*', '"AimOffsetY":1.2', texto)
            print("🧠 HIT CABEÇA GARANTIDO!")

        # 🚀 HIT EM INIMIGOS PULANDO (HS ALTO)
        if ATIVAR_HS_ALTO:
            texto = re.sub(r'"JumpAdjustment":\d+\.?\d*', '"JumpAdjustment":2.0', texto)
            texto = re.sub(r'"AirAimCorrection":\d+\.?\d*', '"AirAimCorrection":3.0', texto)
            texto = re.sub(r'"PredictionFactor":\d+\.?\d*', '"PredictionFactor":1.8', texto)
            print("🚀 HIT EM PULADORES ATIVADO! NINGUÉM ESCAPA!")

        flow.response.text = texto
        print("💥 SISTEMA DE TIRO ELITE CARREGADO!")

def request(flow: http.HTTPFlow):
    # 🚫 BLOQUEAR ATUALIZAÇÃO
    if "VersionCheck" in flow.request.url:
        flow.response = http.Response.make(200, b'{"version":"99.99.99","update":false}')
        print("🚫 ATUALIZAÇÃO BLOQUEADA!")
' > /app/scripts/hack_principal.py

      # ==============================================
      # 🚀 SCRIPT DE INÍCIO - LIGA TUDO
      # ==============================================
      RUN echo '#!/bin/bash
      echo "🔥 INICIANDO: CONFIGURAÇÃO RYAN - RECUO ZERO + HS ELITE 🔥"
      echo "🔗 PROXY RODANDO NA PORTA 8080"
      
      # Servidor para baixar certificado
      cd /app/security && python3 -m http.server 9000 &
      
      # Iniciar o Proxy com o Hack
      mitmproxy -s /app/scripts/hack_principal.py --cert /app/security/xit_full_proxy_cert.pem -p 8080 --no-web
      ' > /app/iniciar_servidor.sh

      # Dar permissões
      RUN chmod +x /app/iniciar_servidor.sh

    startCommand: /app/iniciar_servidor.sh

    ports:
      - port: 8080
        protocol: tcp
      - port: 9000
        protocol: tcp

    healthCheckPath: ""
    autoDeploy: true
